name: Android APK Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Verify Gradle wrapper files
        run: |
          test -f android/gradlew || (echo "Missing android/gradlew" && exit 1)
          test -f android/gradle/wrapper/gradle-wrapper.properties || (echo "Missing gradle-wrapper.properties" && exit 1)
          test -f android/gradle/wrapper/gradle-wrapper.jar || (echo "Missing or invalid gradle-wrapper.jar in repo. Commit a real wrapper jar from a local git-capable environment." && exit 1)
          chmod +x android/gradlew

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build debug APK
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dkotlin.compiler.execution.strategy=in-process
            -Dkotlin.daemon.jvm.options=-Xmx2048m
            -Dfile.encoding=UTF-8
        run: flutter build apk --debug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error