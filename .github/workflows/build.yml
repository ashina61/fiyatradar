name: Build Android APK & AAB (Kotasiz - Yedekli)

on:
  push:
    branches:
      - main
      - develop
      - 'claude/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.22.0'

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- KOTLIN SURUMU DÜZELTME (Fix) ---
      - name: Fix Kotlin Version Automatically
        run: |
          echo "Kotlin sürümü 1.9.0'a güncelleniyor..."
          if [ -f "android/build.gradle" ]; then
            sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.0'/" android/build.gradle
          fi
          if [ -f "android/settings.gradle" ]; then
             sed -i 's/id "org.jetbrains.kotlin.android" version .*/id "org.jetbrains.kotlin.android" version "1.9.0" apply false/' android/settings.gradle
          fi
          echo "Düzeltme tamamlandı."
      # ---------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Build App Bundle (Release)
        run: flutter build appbundle --release

      # --- GARANTİ YUKLEME ADIMI (BashUpload + File.io) ---
      - name: Upload Artifacts (Guaranteed)
        run: |
          echo "---------------------------------------------------"
          echo "1. YONTEM: BASHUPLOAD YUKLENIYOR..."
          curl https://bashupload.com/ -T build/app/outputs/flutter-apk/app-release.apk
          echo " "
          
          echo "---------------------------------------------------"
          echo "2. YONTEM: FILE.IO (Yedek) YUKLENIYOR..."
          # File.io tek indirimliktir, indirdikten sonra silinir!
          curl -F "file=@build/app/outputs/flutter-apk/app-release.apk" https://file.io
          echo " "
          
          echo "---------------------------------------------------"
          echo "NOT: Yukaridaki linklerden birini kopyalayip tarayicida ac."
          echo "Bashupload linki 'wget' ile baslar, sadece https kismini al."
          echo "---------------------------------------------------"
