name: Build Android APK (Final - Saglam Link)

on:
  push:
    branches:
      - main
      - develop
      - 'claude/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.22.0'

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- KOTLIN SURUMU DÜZELTME ---
      - name: Fix Kotlin Version Automatically
        run: |
          if [ -f "android/build.gradle" ]; then
            sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.0'/" android/build.gradle
          fi
          if [ -f "android/settings.gradle" ]; then
             sed -i 's/id "org.jetbrains.kotlin.android" version .*/id "org.jetbrains.kotlin.android" version "1.9.0" apply false/' android/settings.gradle
          fi
      # ---------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Build App Bundle (Release)
        run: flutter build appbundle --release

      # --- EN SAGLAM YUKLEME ADIMI (0x0.st + Catbox) ---
      - name: Upload Artifacts (Developer Mode)
        run: |
          echo "---------------------------------------------------"
          echo "1. DENEME: 0x0.st (En Saglam) YUKLENIYOR..."
          # Bu site Linuxcularin kullandigi cok hizli bir yerdir
          curl -F "file=@build/app/outputs/flutter-apk/app-release.apk" https://0x0.st
          echo " "
          
          echo "---------------------------------------------------"
          echo "2. DENEME: CATBOX.MOE (Yedek) YUKLENIYOR..."
          curl -F "reqtype=fileupload" -F "fileToUpload=@build/app/outputs/flutter-apk/app-release.apk" https://catbox.moe/user/api.php
          echo " "
          
          echo "---------------------------------------------------"
          echo "LUTFEN DIKKAT:"
          echo "Yukarida 'https://0x0.st/...' veya 'catbox.moe/...' ile baslayan linki kopyala."
          echo "---------------------------------------------------"
          
