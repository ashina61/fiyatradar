name: Build Android APK (HIZLI & TEMIZ)

on:
  push:
    branches:
      - main
      - develop
      - 'claude/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.22.0'

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- KOTLIN SURUMU DÜZELTME ---
      - name: Fix Kotlin Version Automatically
        run: |
          if [ -f "android/build.gradle" ]; then
            sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.0'/" android/build.gradle
          fi
          if [ -f "android/settings.gradle" ]; then
             sed -i 's/id "org.jetbrains.kotlin.android" version .*/id "org.jetbrains.kotlin.android" version "1.9.0" apply false/' android/settings.gradle
          fi
      # ---------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Build App Bundle (Release)
        run: flutter build appbundle --release

      # --- TURBO YUKLEME ADIMI ---
      - name: Upload Artifacts (Fast Mode)
        run: |
          echo "======================================================="
          echo "1. DENEME: CATBOX.MOE (En Hizlisi)"
          echo "Yukleniyor, lutfen bekle..."
          # Sessiz modda yukle, sadece sonucu goster
          curl -s -F "reqtype=fileupload" -F "fileToUpload=@build/app/outputs/flutter-apk/app-release.apk" https://catbox.moe/user/api.php
          echo " "
          echo "======================================================="
          
          echo " "
          echo "2. DENEME: TMPFILES.ORG (Yedek)"
          echo "Yukleniyor..."
          curl -s -F "file=@build/app/outputs/flutter-apk/app-release.apk" https://tmpfiles.org/api/v1/upload | grep -o 'https://tmpfiles.org/[^"]*'
          echo " "
          echo "======================================================="
          echo "LUTFEN DIKKAT:"
          echo "Yukaridaki https://files.catbox.moe/... linkine tikla indir."
          echo "Eger TmpFiles linki gelirse, linkteki 'tmpfiles.org' kismini"
          echo "'tmpfiles.org/dl' olarak degistirmen gerekebilir."
          echo "======================================================="
