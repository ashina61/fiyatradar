name: Build Android APK & AAB (Kotasiz)

on:
  push:
    branches:
      - main
      - develop
      - 'claude/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.22.0'

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- BURASI KOTLIN HATASINI OTOMATIK DUZELTECEK ---
      - name: Fix Kotlin Version Automatically
        run: |
          echo "Kotlin sürümü 1.9.0'a güncelleniyor..."
          # build.gradle varsa değiştir
          if [ -f "android/build.gradle" ]; then
            sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.0'/" android/build.gradle
          fi
          # settings.gradle varsa değiştir
          if [ -f "android/settings.gradle" ]; then
             sed -i 's/id "org.jetbrains.kotlin.android" version .*/id "org.jetbrains.kotlin.android" version "1.9.0" apply false/' android/settings.gradle
          fi
          echo "Düzeltme tamamlandı."
      # ---------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Build App Bundle (Release)
        run: flutter build appbundle --release

      # --- BURASI DOSYAYI TRANSFER.SH'A YUKLER (KOTA YEMEZ) ---
      - name: Upload APK & AAB to Transfer.sh
        run: |
          echo "APK Yukleniyor..."
          curl --upload-file build/app/outputs/flutter-apk/app-release.apk https://transfer.sh/app-release.apk
          echo " "
          echo "AAB Yukleniyor..."
          curl --upload-file build/app/outputs/bundle/release/app-release.aab https://transfer.sh/app-release.aab
          echo " "
          echo "---------------------------------------------------"
          echo "LINKLER HAZIR! YUKARIDAKI URL'LERI KOPYALA VE INDIR"
          echo "---------------------------------------------------"
