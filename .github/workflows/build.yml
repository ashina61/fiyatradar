name: Build Android (Final Fix)

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.22.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Kotlin Hatası Düzeltici
      - name: Fix Kotlin Version
        run: |
          if [ -f "android/build.gradle" ]; then
            sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.0'/" android/build.gradle
          fi
          if [ -f "android/settings.gradle" ]; then
             sed -i 's/id "org.jetbrains.kotlin.android" version .*/id "org.jetbrains.kotlin.android" version "1.9.0" apply false/' android/settings.gradle
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # --- İKONLARI OLUŞTURMA KOMUTU (Bunu ekledim) ---
      - name: Generate Icons
        run: dart run flutter_launcher_icons || echo "Ikon ayari yoksa devam et"

      - name: Build APK
        run: flutter build apk --release

      # --- ZIPLE VE YÜKLE (PixelDrain) ---
      - name: Upload Artifacts
        run: |
          echo "APK Zipleniyor..."
          cd build/app/outputs/flutter-apk/
          zip -r app-release.zip app-release.apk
          cd ../../../..
          
          echo "PixelDrain'e Yukleniyor..."
          # Sessizce yükleyip sadece ID'yi alıyoruz
          RESPONSE=$(curl -s -T "build/app/outputs/flutter-apk/app-release.zip" -u : "https://pixeldrain.com/api/file")
          ID=$(echo $RESPONSE | grep -o '"id":"[^"]*' | cut -d'"' -f4)
          
          echo " "
          echo "======================================================="
          echo "✅ İNDİRME LİNKİN HAZIR:"
          echo "https://pixeldrain.com/u/$ID"
          echo "======================================================="
          
