name: Build Android (Final - Kotlin Fix)

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.22.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- BURASI HAYAT KURTARAN KISIM ---
      # Kotlin'i 2.0.21 yapiyoruz (Firebase icin sart)
      # MinSDK'yi 23 yapiyoruz (Garanti olsun)
      - name: Force Fix Configuration
        run: |
          echo "Kotlin ve MinSDK ayarlaniyor..."
          
          # 1. Build.gradle icindeki Kotlin surumunu 2.0.21 yap
          if [ -f "android/build.gradle" ]; then
            sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '2.0.21'/" android/build.gradle
          fi
          
          # 2. Settings.gradle icindeki plugin surumunu 2.0.21 yap
          if [ -f "android/settings.gradle" ]; then
             sed -i 's/id "org.jetbrains.kotlin.android" version .*/id "org.jetbrains.kotlin.android" version "2.0.21" apply false/' android/settings.gradle
          fi
          
          # 3. App/Build.gradle icindeki minSdkVersion'i 23 yap (Zorla)
          if [ -f "android/app/build.gradle" ]; then
             sed -i 's/minSdkVersion [0-9]*/minSdkVersion 23/' android/app/build.gradle
          fi
          
          echo "Ayarlar zorla güncellendi!"

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # Ikonlari olustur
      - name: Generate Icons
        run: dart run flutter_launcher_icons || echo "Ikon config yoksa devam et"

      - name: Build APK
        run: flutter build apk --release

      # --- ZİP VE YÜKLE (PixelDrain - Calisan Yontem) ---
      - name: Upload Artifacts
        run: |
          echo "APK Zipleniyor..."
          cd build/app/outputs/flutter-apk/
          zip -r app-release.zip app-release.apk
          cd ../../../..
          
          echo "PixelDrain'e Yukleniyor..."
          RESPONSE=$(curl -s -T "build/app/outputs/flutter-apk/app-release.zip" -u : "https://pixeldrain.com/api/file")
          ID=$(echo $RESPONSE | grep -o '"id":"[^"]*' | cut -d'"' -f4)
          
          echo " "
          echo "======================================================="
          echo "✅ İNDİRME LİNKİN (Bu Sefer Bitti):"
          echo "https://pixeldrain.com/u/$ID"
          echo "======================================================="
