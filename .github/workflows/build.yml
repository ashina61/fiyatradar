name: Build Android (Filebin ZIP - Final)

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.22.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- 1. KOTLIN VE MINSDK DÜZELTME (Build Patlamasın Diye Şart) ---
      - name: Force Fix Kotlin & MinSDK
        run: |
          echo "Kotlin sürümü 2.0.21 yapiliyor..."
          
          # build.gradle güncelle
          if [ -f "android/build.gradle" ]; then
            sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '2.0.21'/" android/build.gradle
          fi
          
          # settings.gradle güncelle
          if [ -f "android/settings.gradle" ]; then
             sed -i 's/id "org.jetbrains.kotlin.android" version .*/id "org.jetbrains.kotlin.android" version "2.0.21" apply false/' android/settings.gradle
          fi
          
          # MinSDK 23 yap (Firebase icin sart)
          if [ -f "android/app/build.gradle" ]; then
             sed -i 's/minSdkVersion [0-9]*/minSdkVersion 23/' android/app/build.gradle
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # --- 2. IKONLARI OLUSTURMA ---
      - name: Generate Icons
        run: dart run flutter_launcher_icons || echo "Ikon config yok, geciliyor"

      - name: Build APK
        run: flutter build apk --release

      # --- 3. ZIPLE VE FILEBIN'E YUKLE (Senin İstedigin Yontem) ---
      - name: Upload to Filebin (ZIP)
        run: |
          echo "APK Zipleniyor (Filebin kabul etsin diye)..."
          cd build/app/outputs/flutter-apk/
          zip -r app-release.zip app-release.apk
          cd ../../../..
          
          echo "Filebin'e Yukleniyor..."
          # Rastgele ID ile link cakismasini onle
          BIN_ID="fiyatradar-$(date +%s)"
          
          curl -T build/app/outputs/flutter-apk/app-release.zip "https://filebin.net/$BIN_ID/app-release.zip"
          
          echo " "
          echo "======================================================="
          echo "✅ İNDİRME LİNKİN HAZIR:"
          echo "https://filebin.net/$BIN_ID/app-release.zip"
          echo "======================================================="
