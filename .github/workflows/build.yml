name: Build Android APK (ZIP & PixelDrain)

on:
  push:
    branches:
      - main
      - develop
      - 'claude/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.22.0'

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- KOTLIN SURUMU DÜZELTME ---
      - name: Fix Kotlin Version Automatically
        run: |
          if [ -f "android/build.gradle" ]; then
            sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.0'/" android/build.gradle
          fi
          if [ -f "android/settings.gradle" ]; then
             sed -i 's/id "org.jetbrains.kotlin.android" version .*/id "org.jetbrains.kotlin.android" version "1.9.0" apply false/' android/settings.gradle
          fi
      # ---------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Build App Bundle (Release)
        run: flutter build appbundle --release

      # --- AKILLI YUKLEME ADIMI (ZIP + PixelDrain) ---
      - name: Upload Artifacts (Anti-Block Mode)
        run: |
          echo "======================================================="
          echo "HAZIRLIK: APK DOSYASI ZIPLENIYOR (Engeli Asmak Icin)..."
          # APK'yi zip içine koyuyoruz ki sunucu 'illegal extension' demesin
          cd build/app/outputs/flutter-apk/
          zip -r app-release.zip app-release.apk
          cd ../../../..
          echo "Zipleme Tamam."
          echo "======================================================="

          echo " "
          echo "1. DENEME: PIXELDRAIN (En Saglami)"
          echo "Yukleniyor..."
          # PixelDrain APK kabul eder, etmezse ZIP deneriz
          RESPONSE=$(curl -s -T "build/app/outputs/flutter-apk/app-release.apk" -u : "https://pixeldrain.com/api/file")
          # ID'yi ceker
          ID=$(echo $RESPONSE | grep -o '"id":"[^"]*' | cut -d'"' -f4)
          
          if [ -z "$ID" ]; then
            echo "APK yuklenemedi, ZIP deniyoruz..."
            RESPONSE=$(curl -s -T "build/app/outputs/flutter-apk/app-release.zip" -u : "https://pixeldrain.com/api/file")
            ID=$(echo $RESPONSE | grep -o '"id":"[^"]*' | cut -d'"' -f4)
          fi

          echo " "
          echo "-------------------------------------------------------"
          echo "PIXELDRAIN LINKI (APK):"
          echo "https://pixeldrain.com/u/$ID"
          echo "-------------------------------------------------------"

          echo " "
          echo "======================================================="
          echo "2. DENEME: FILEBIN (ZIP MODU)"
          echo "APK yerine ZIP yukluyoruz, boylece hata vermeyecek..."
          
          BIN_ID="fiyatradar-$(date +%s)"
          curl -T build/app/outputs/flutter-apk/app-release.zip "https://filebin.net/$BIN_ID/app-release.zip"
          
          echo " "
          echo "-------------------------------------------------------"
          echo "FILEBIN LINKI (ZIP):"
          echo "https://filebin.net/$BIN_ID/app-release.zip"
          echo "-------------------------------------------------------"
