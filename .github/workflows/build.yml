name: Android APK Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Generate clean Gradle wrapper outside Android project
        run: |
          rm -rf /tmp/gradle-wrapper-bootstrap
          mkdir -p /tmp/gradle-wrapper-bootstrap
          cd /tmp/gradle-wrapper-bootstrap

          cat > settings.gradle <<'EOF'
          rootProject.name = 'wrapper-bootstrap'
          EOF

          cat > build.gradle <<'EOF'
          tasks.register("noop")
          EOF

          gradle wrapper --gradle-version 8.4

          mkdir -p "$GITHUB_WORKSPACE/android/gradle/wrapper"
          cp gradlew "$GITHUB_WORKSPACE/android/gradlew"
          cp gradlew.bat "$GITHUB_WORKSPACE/android/gradlew.bat"
          cp gradle/wrapper/gradle-wrapper.jar "$GITHUB_WORKSPACE/android/gradle/wrapper/gradle-wrapper.jar"
          cp gradle/wrapper/gradle-wrapper.properties "$GITHUB_WORKSPACE/android/gradle/wrapper/gradle-wrapper.properties"

      - name: Make wrapper executable
        run: chmod +x android/gradlew

      - name: Verify wrapper
        run: |
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f android/gradle/wrapper/gradle-wrapper.properties
          ./android/gradlew --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze (non-blocking for infos/warnings)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Ensure missing asset folders do not fail build
        run: mkdir -p assets/icons/categories

      - name: Build debug APK
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dkotlin.compiler.execution.strategy=in-process
            -Dfile.encoding=UTF-8
            -Dorg.gradle.jvmargs=-Xmx4g
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error