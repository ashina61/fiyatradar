name: Build Android APK (Filebin - Garanti Yontem)

on:
  push:
    branches:
      - main
      - develop
      - 'claude/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.22.0'

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- KOTLIN SURUMU DÜZELTME ---
      - name: Fix Kotlin Version Automatically
        run: |
          if [ -f "android/build.gradle" ]; then
            sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.0'/" android/build.gradle
          fi
          if [ -f "android/settings.gradle" ]; then
             sed -i 's/id "org.jetbrains.kotlin.android" version .*/id "org.jetbrains.kotlin.android" version "1.9.0" apply false/' android/settings.gradle
          fi
      # ---------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Build App Bundle (Release)
        run: flutter build appbundle --release

      # --- GARANTİ YUKLEME ADIMI (Filebin + Uguu) ---
      - name: Upload Artifacts (Fail-Safe)
        run: |
          echo "======================================================="
          echo "1. DENEME: FILEBIN.NET (Garanti Link)"
          echo "Yukleniyor..."
          
          # Rastgele bir ID uretiyoruz ki link cakismasin
          BIN_ID="fiyatradar-$(date +%s)"
          
          # Dosyayi direk o ID'ye yukluyoruz
          curl -T build/app/outputs/flutter-apk/app-release.apk "https://filebin.net/$BIN_ID/app-release.apk"
          
          echo " "
          echo "-------------------------------------------------------"
          echo "APK INDIRME LINKIN HAZIR (TIKLA INDIR):"
          echo "https://filebin.net/$BIN_ID/app-release.apk"
          echo "-------------------------------------------------------"
          echo " "
          
          echo "======================================================="
          echo "2. DENEME: UGUU.SE (Yedek)"
          # Uguu.se animeci ve yazilimcilarin dostudur, kolay kolay cokmez
          curl -F "files[]=@build/app/outputs/flutter-apk/app-release.apk" https://uguu.se/upload.php
          echo " "
          echo "======================================================="
