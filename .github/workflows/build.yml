name: Android APK Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: Bootstrap valid Gradle wrapper (8.6)
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          cat > "${tmp_dir}/build.gradle" <<'EOF'
          tasks.register("noop")
          EOF
          (
            cd "${tmp_dir}"
            gradle wrapper --gradle-version 8.6 --no-daemon
          )
          cp "${tmp_dir}/gradlew" android/gradlew
          cp "${tmp_dir}/gradlew.bat" android/gradlew.bat
          cp "${tmp_dir}/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
          cp "${tmp_dir}/gradle/wrapper/gradle-wrapper.properties" android/gradle/wrapper/gradle-wrapper.properties
          chmod +x android/gradlew

      - name: Flutter pub get
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
