name: Firebase Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Sadece default branch (claude/fiyatradar-app-oKr5R) üzerinden manuel
    # tetikleme kabul ediliyor; diğer feature branch'lerden yanlışlıkla prod'a
    # basılmasın diye guard.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/claude/fiyatradar-app-oKr5R'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm install

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Write service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is empty."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service-account.json" >> "$GITHUB_ENV"

      - name: Deploy Cloud Functions and Firestore rules/indexes
        # NOT: firestore:indexes daha önce eksikti — step adı "indexes" dese de
        # komut deploy etmiyordu (audit Y2). productAlerts collection-group
        # index'i olmadan alarm sorguları FAILED_PRECONDITION alıyordu.
        run: >-
          firebase deploy --project fiyatradar-611967
          --only functions:onProductPriceDrop,functions:onPriceGroupUpdate,functions:onPriceVerificationChange,functions:verifyPurchase,functions:enforceFreeAlertLimit,functions:processAccountDeletion,firestore:rules,firestore:indexes
          --non-interactive --force

      - name: Clean up credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"
