name: Engineering Guardrails

on:
  pull_request:
  workflow_dispatch:

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run engineering guardrails check
        run: bash scripts/check_engineering_rules.sh
