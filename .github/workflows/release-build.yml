name: Release AAB Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Bootstrap valid Gradle wrapper (8.6)
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          cat > "${tmp_dir}/build.gradle" <<'EOF'
          tasks.register("noop")
          EOF
          (
            cd "${tmp_dir}"
            gradle wrapper --gradle-version 8.6 --no-daemon
          )
          cp "${tmp_dir}/gradlew" android/gradlew
          cp "${tmp_dir}/gradlew.bat" android/gradlew.bat
          cp "${tmp_dir}/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
          cp "${tmp_dir}/gradle/wrapper/gradle-wrapper.properties" android/gradle/wrapper/gradle-wrapper.properties
          chmod +x android/gradlew

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode upload keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is empty"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          # Sanity check: should be > 1KB and parseable as a keystore.
          ls -l android/upload-keystore.jks
          keytool -list -keystore android/upload-keystore.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" >/dev/null

      - name: Build signed release AAB
        env:
          KEYSTORE_PATH: android/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: upload
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Clean up keystore (paranoid)
        if: always()
        run: |
          rm -f android/upload-keystore.jks
          # Best-effort: scrub any decoded copies that may have leaked.
          find . -name 'upload-keystore.jks' -type f -delete 2>/dev/null || true
