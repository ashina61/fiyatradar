name: Release AAB Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Bootstrap valid Gradle wrapper (8.6)
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          cat > "${tmp_dir}/build.gradle" <<'EOF'
          tasks.register("noop")
          EOF
          (
            cd "${tmp_dir}"
            gradle wrapper --gradle-version 8.6 --no-daemon
          )
          cp "${tmp_dir}/gradlew" android/gradlew
          cp "${tmp_dir}/gradlew.bat" android/gradlew.bat
          cp "${tmp_dir}/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/gradle-wrapper.jar
          cp "${tmp_dir}/gradle/wrapper/gradle-wrapper.properties" android/gradle/wrapper/gradle-wrapper.properties
          chmod +x android/gradlew

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode upload keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is empty"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          # Sanity check: should be > 1KB and parseable as a keystore.
          ls -l android/upload-keystore.jks
          keytool -list -keystore android/upload-keystore.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" >/dev/null

      - name: Build signed release AAB
        env:
          # Absolute path: avoids any ambiguity about Gradle's file() resolution
          # (which would otherwise resolve relative paths from android/app/, not
          # the repo root — that mismatch is what previously caused silent
          # debug signing).
          KEYSTORE_PATH: ${{ github.workspace }}/android/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: upload
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Verify AAB is release-signed (not debug)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          aab=build/app/outputs/bundle/release/app-release.aab
          if [ ! -f "$aab" ]; then
            echo "::error::AAB not produced at $aab"
            exit 1
          fi
          # AABs are JAR-signed (apksigner verify doesn't apply). Read the
          # signer cert with keytool and compare its SHA-256 fingerprint
          # against the upload keystore. If the AAB ended up debug-signed,
          # the fingerprints won't match and the job fails.
          aab_cert_block=$(keytool -printcert -jarfile "$aab")
          echo "--- AAB signer cert ---"
          echo "$aab_cert_block"
          ks_cert_block=$(keytool -list -v -keystore android/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" -alias upload)
          echo "--- Upload keystore cert ---"
          echo "$ks_cert_block"
          aab_fp=$(printf '%s\n' "$aab_cert_block" \
            | awk -F'SHA256:[[:space:]]*' '/SHA256:/ { print $2; exit }')
          ks_fp=$(printf '%s\n' "$ks_cert_block" \
            | awk -F'SHA256:[[:space:]]*' '/SHA256:/ { print $2; exit }')
          if [ -z "$aab_fp" ] || [ -z "$ks_fp" ]; then
            echo "::error::Could not extract SHA-256 fingerprint from one of the certs"
            exit 1
          fi
          if [ "$aab_fp" != "$ks_fp" ]; then
            echo "::error::AAB signer SHA-256 ($aab_fp) does not match upload keystore ($ks_fp)"
            exit 1
          fi
          echo "AAB is release-signed with the upload keystore (SHA-256: $aab_fp)."

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Clean up keystore (paranoid)
        if: always()
        run: |
          rm -f android/upload-keystore.jks
          # Best-effort: scrub any decoded copies that may have leaked.
          find . -name 'upload-keystore.jks' -type f -delete 2>/dev/null || true
