name: Firebase Functions Only Deploy

# Bildirim sistemi sprintinde Firestore rules/indexes deploy'u sorun
# çıkardığı için sadece Cloud Functions'ı deploy eden ayrı bir workflow.
# `firebase-deploy.yml` dosyasına dokunmuyoruz; bu workflow onun yanında
# yaşar ve yalnızca functions günceller.

on:
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    # Sadece default branch (claude/fiyatradar-app-oKr5R) üzerinden manuel
    # tetikleme kabul ediliyor; feature branch'lerden yanlışlıkla prod'a
    # basılmasın diye guard.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/claude/fiyatradar-app-oKr5R'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm install

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Write service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is empty."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service-account.json" >> "$GITHUB_ENV"

      # Yalnızca functions deploy edilir — firestore:rules / firestore:indexes
      # bu workflow'da BİLEREK yok. Index deploy'u ayrı tutuyoruz.
      - name: Deploy Cloud Functions only
        run: firebase deploy --project fiyatradar-611967 --only functions --non-interactive --force

      - name: Clean up credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"
