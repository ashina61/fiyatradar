workflows:
  fiyatradar-android-build:
    name: Build Android (FiyatRadar)
    instance_type: linux # <--- SADECE BURAYI 'linux' OLARAK DÜZELTTİK
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
        - pattern: 'develop'
          include: true
        - pattern: 'claude/**'
          include: true
    environment:
      flutter: 3.22.0
      java: 17
    scripts:
      - name: Force Fix Kotlin & MinSDK
        script: |
          if [ -f "android/build.gradle" ]; then
            sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '2.0.21'/" android/build.gradle
          fi
          if [ -f "android/settings.gradle" ]; then
             sed -i 's/id "org.jetbrains.kotlin.android" version .*/id "org.jetbrains.kotlin.android" version "2.0.21" apply false/' android/settings.gradle
          fi
          if [ -f "android/app/build.gradle" ]; then
             sed -i 's/minSdkVersion [0-9]*/minSdkVersion 23/' android/app/build.gradle
          fi

      - name: Paketleri Getir
        script: flutter pub get

      - name: Generate Icons
        script: dart run flutter_launcher_icons || echo "ikon yoksa devam"

      - name: Build APK
        script: flutter build apk --release

      - name: 🔥 GET SHA-1 FINGERPRINT (BUNU KOPYALA)
        script: |
          echo " "
          echo "======================================================="
          echo "🔐 FIREBASE ICIN SHA-1 KODUN:"
          echo " "
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep "SHA1: " | cut -d " " -f 3 || echo "SHA-1 Bulunamadı"
          echo " "
          echo "👉 Yukaridaki kodu kopyala ve Firebase -> Project Settings -> Add Fingerprint kismina yapistir."
          echo "======================================================="

      - name: Upload to Filebin
        script: |
          cd build/app/outputs/flutter-apk/
          zip -r app-release.zip app-release.apk
          cd ../../../..
          BIN_ID="fiyatradar-$(date +%s)"
          curl -T build/app/outputs/flutter-apk/app-release.zip "https://filebin.net/$BIN_ID/app-release.zip"
          echo "⬇️ İNDİRME LİNKİ: https://filebin.net/$BIN_ID/app-release.zip"

    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.zip
