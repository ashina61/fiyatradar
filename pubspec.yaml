name: fiyatradar
description: FiyatRadar - Fiyat karşılaştırma ve takip uygulaması
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Typography
  google_fonts: ^6.1.0

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.1
  # firebase_messaging + flutter_local_notifications stay declared so the
  # in-progress FCM wiring (functions/index.js → users/{uid}.fcmToken) can
  # land without another pubspec round-trip.
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^17.2.3
  google_sign_in: ^6.2.1

  # UI / icons
  cupertino_icons: ^1.0.6

  # Utilities
  image_picker: ^1.0.7
  # mobile_scanner stays declared so the barcode scan flow can be wired in
  # without another pubspec round-trip — currently the barcode is entered
  # manually in product_request_screen.dart.
  mobile_scanner: ^5.2.3
  geolocator: ^11.0.0
  geocoding: ^2.1.1
  local_auth: ^2.3.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/app_logo.png
    - assets/icons/icon.png
    - assets/fiyatradar_marketler.json
    - assets/fiyatradar_urunler.json
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/app_logo.png"
