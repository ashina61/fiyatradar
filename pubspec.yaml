name: fiyatradar
description: FiyatRadar - Fiyat karşılaştırma ve takip uygulaması
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.1
  firebase_messaging: ^15.0.1
  google_sign_in: ^6.2.1

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # UI/UX
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.1
  photo_view: ^0.14.0
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0

  # Utils
  image_picker: ^1.0.7
  mobile_scanner: ^5.2.3
  geolocator: ^11.0.0
  geocoding: ^2.1.1
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  http: ^1.2.2
  timeago: ^3.6.1

  # Navigation
  go_router: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_logo.png

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_logo.png"
