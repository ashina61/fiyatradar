name: fiyatradar
description: FiyatRadar - Fiyat karşılaştırma ve takip uygulaması
publish_to: 'none'
# Beta-1 sürümü: ilk Play Store internal track yüklemesi için.
# CI versionCode'u `release-build.yml` içinde
# `VERSION_CODE_OFFSET (=100) + github.run_number` ile override eder; bu
# satırdaki +N yalnızca local build'ler için fallback'tir. Play'e versionCode
# 5'e kadar yüklendiğinden local fallback 101'den başlatıldı.
# versionName (sol taraf) uygulama içi "Yenilikler" changelog'uyla hizalı
# tutulur — en güncel giriş v1.0.7. CI yalnız versionCode'u override ettiği
# için versionName pubspec'ten gelir; release öncesi burada güncel olmalı.
version: 1.0.7+101

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Typography
  google_fonts: ^6.1.0

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.1
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^17.2.3
  # Crash + analytics for Play Store readiness. Beta'da Crashlytics opt-in
  # bayrağıyla işliyoruz (kullanıcı debug build'te göndermesin).
  firebase_crashlytics: ^4.1.3
  firebase_analytics: ^11.3.3
  google_sign_in: ^6.2.1

  # UI / icons
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1

  # Utilities
  image_picker: ^1.0.7
  mobile_scanner: ^5.2.3
  geolocator: ^11.0.0
  geocoding: ^2.1.1
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.1
  # OpenFoodFacts barkod lookup. Admin paneli ürün eklerken
  # https://world.openfoodfacts.org/api/v0/product/{barcode}.json
  # uçundan gelen front image_url'i otomatik dolduruyor.
  http: ^1.2.0

  # FiyatRadar Pro: Play Billing (Android) + StoreKit (iOS) için
  # ortak abstraction. Cloud Function tarafı Google Play Developer API
  # üzerinden purchase doğrular ve user.isPremium / premiumUntil yazar.
  in_app_purchase: ^3.2.0
  # Play Billing'e özel ProductDetails (GooglePlayProductDetails →
  # subscriptionOfferDetails → pricingPhases). Abonelik kartında deneme
  # fazı değil YİNELENEN fiyatı göstermek için gerekli; in_app_purchase
  # zaten transitive çekiyor ama platform tipine erişmek için doğrudan
  # bağımlılık şart (depend_on_referenced_packages lint).
  in_app_purchase_android: '>=0.3.0 <0.5.0'

  # AdMob banner + interstitial. AdsService bu paketi sarıyor; Pro
  # kullanıcılar (state.premium.isActive) hiç reklam görmez. Production
  # geçişinde:
  #   • android/app/src/main/AndroidManifest.xml içindeki test app id'sini
  #     gerçek AdMob app id'si ile değiştir.
  #   • ios/Runner/Info.plist GADApplicationIdentifier'ı güncelle.
  #   • AdsService içindeki kAdUnitIds map'ini production unit'lere bağla.
  google_mobile_ads: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/app_logo.png
    - assets/images/fiyatradar_logo.png
    - assets/images/fr_mark_foreground.png
    - assets/icons/icon.png
    # NOT: fiyatradar_marketler.json (732KB) ve fiyatradar_urunler.json
    # uygulama kodunda hiç okunmuyor — yalnız scripts/ import araçları
    # repo'dan kullanıyor. APK'yı şişirmesin diye bundle'dan çıkarıldı;
    # dosyalar repo'da duruyor.
    - assets/illustrations/
    - assets/illustrations/manifest.json
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#FCF6E9"
  adaptive_icon_foreground: "assets/images/fr_mark_foreground.png"
