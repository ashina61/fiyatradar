name: fiyatradar
description: FiyatRadar - Fiyat karşılaştırma ve takip uygulaması
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.10+1

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.0
  crypto: ^3.0.6
  firebase_storage: ^12.0.1
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^17.2.3
  google_sign_in: ^6.2.1

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # UI/UX
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.1
  photo_view: ^0.14.0
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  font_awesome_flutter: 10.6.0

  # Utils
  image_picker: ^1.0.7
  mobile_scanner: ^5.2.3
  geolocator: ^11.0.0
  geocoding: ^2.1.1
  intl: 0.20.2
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  image: ^4.2.0
  timeago: ^3.6.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.1
  share_plus: ^10.0.2
  fl_chart: ^0.69.2

  # Navigation
  go_router: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.13.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/app_logo.png
    - assets/fiyatradar_marketler.json
    - assets/fiyatradar_urunler.json
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/app_logo.png"
