plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Release imza kaynak önceliği:
//   1) CI ortam değişkenleri (KEYSTORE_PATH, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)
//   2) android/key.properties (local dev için, .gitignore'da)
// Hiçbiri yoksa release build patlasin (sessizce debug imzasına düşmek
// Play Console'da "debug signed" hatasına yol açıyordu).
def envKeystorePath = System.getenv('KEYSTORE_PATH')
def envKeystorePassword = System.getenv('KEYSTORE_PASSWORD')
def envKeyAlias = System.getenv('KEY_ALIAS')
def envKeyPassword = System.getenv('KEY_PASSWORD')

def hasEnvKeystore = envKeystorePath != null && !envKeystorePath.trim().isEmpty() &&
        envKeystorePassword != null && envKeyAlias != null && envKeyPassword != null

// Project.file() resolves relative paths from android/app/, but CI passes
// KEYSTORE_PATH relative to the repo root (android/upload-keystore.jks).
// rootProject.file() resolves from android/, which lines up with the decode
// step. Absolute paths pass through unchanged.
def resolveKeystoreFile = { String path ->
    def candidate = new File(path)
    return candidate.isAbsolute() ? candidate : rootProject.file(path)
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}
def hasFileKeystore = !hasEnvKeystore &&
        keystoreProperties.getProperty('storeFile') != null

android {
    namespace "com.fiyatradar"
    compileSdk 35
    ndkVersion = "26.1.10909125"

    // flutter_local_notifications requires Java 8+ APIs via desugaring.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.fiyatradar"
        minSdk 23
        targetSdk 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        if (hasEnvKeystore) {
            release {
                def keystoreFile = resolveKeystoreFile(envKeystorePath)
                if (!keystoreFile.exists()) {
                    throw new GradleException(
                            "KEYSTORE_PATH set to '${envKeystorePath}' but resolved file " +
                                    "does not exist: ${keystoreFile.absolutePath}")
                }
                storeFile keystoreFile
                storePassword envKeystorePassword
                keyAlias envKeyAlias
                keyPassword envKeyPassword
            }
        } else if (hasFileKeystore) {
            release {
                def storeFileProp = keystoreProperties.getProperty('storeFile')
                def keystoreFile = file(storeFileProp)
                if (!keystoreFile.exists()) {
                    throw new GradleException(
                            "android/key.properties storeFile '${storeFileProp}' resolves to " +
                                    "${keystoreFile.absolutePath} which does not exist")
                }
                storeFile keystoreFile
                storePassword keystoreProperties.getProperty('storePassword')
                keyAlias keystoreProperties.getProperty('keyAlias')
                keyPassword keystoreProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            // No silent fallback to debug. If signingConfigs.release wasn't
            // created (neither env nor key.properties), this stays null and the
            // taskGraph guard below throws before any release task runs.
            signingConfig signingConfigs.findByName('release')
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Fail loudly when a release task is requested without real signing config.
// Deferred to taskGraph so local debug builds (flutter run) still work without
// any keystore configured.
gradle.taskGraph.whenReady { taskGraph ->
    def needsRelease = taskGraph.allTasks.any { task ->
        def name = task.name.toLowerCase()
        name.contains('release') && (
                name.contains('assemble') || name.contains('bundle') || name.contains('package'))
    }
    if (needsRelease && !hasEnvKeystore && !hasFileKeystore) {
        throw new GradleException(
                "Release build requested but no signing config available. Set " +
                        "KEYSTORE_PATH / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD env " +
                        "vars (CI) or create android/key.properties (local). Refusing to " +
                        "silently fall back to debug signing.")
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'androidx.multidex:multidex:2.0.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
