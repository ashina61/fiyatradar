plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Release imza kaynak önceliği:
//   1) CI ortam değişkenleri (KEYSTORE_PATH, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)
//   2) android/key.properties (local dev için, .gitignore'da)
//   3) Debug imza (her ikisi de yoksa — local geliştirme akışı kırılmasın)
def envKeystorePath = System.getenv('KEYSTORE_PATH')
def envKeystorePassword = System.getenv('KEYSTORE_PASSWORD')
def envKeyAlias = System.getenv('KEY_ALIAS')
def envKeyPassword = System.getenv('KEY_PASSWORD')

def hasEnvKeystore = envKeystorePath != null && !envKeystorePath.isEmpty() &&
        envKeystorePassword != null && envKeyAlias != null && envKeyPassword != null &&
        file(envKeystorePath).exists()

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}
def hasFileKeystore = !hasEnvKeystore &&
        keystoreProperties.getProperty('storeFile') != null &&
        file(keystoreProperties.getProperty('storeFile')).exists()

def hasReleaseKeystore = hasEnvKeystore || hasFileKeystore

android {
    namespace "com.fiyatradar"
    compileSdk 35
    ndkVersion = "26.1.10909125"

    // flutter_local_notifications requires Java 8+ APIs via desugaring.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.fiyatradar"
        minSdk 23
        targetSdk 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        if (hasEnvKeystore) {
            release {
                storeFile file(envKeystorePath)
                storePassword envKeystorePassword
                keyAlias envKeyAlias
                keyPassword envKeyPassword
            }
        } else if (hasFileKeystore) {
            release {
                keyAlias keystoreProperties.getProperty('keyAlias')
                keyPassword keystoreProperties.getProperty('keyPassword')
                storeFile file(keystoreProperties.getProperty('storeFile'))
                storePassword keystoreProperties.getProperty('storePassword')
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasReleaseKeystore ? signingConfigs.getByName('release') : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'androidx.multidex:multidex:2.0.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
