allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Compatibility shim for older Flutter Android plugins (for example
// geolocator_android 4.x) that still read SDK versions from `project.flutter`.
ext {
    kotlin_version = '2.1.21'
    flutter = [
        compileSdkVersion: 35,
        minSdkVersion    : 23,
        targetSdkVersion : 35,
    ]
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
